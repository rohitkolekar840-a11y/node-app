version: '3.8'

services:
  app:
    image: rohitkolekar/node-app:v1
    ports:
      - "4000:3000"   # App is exposed externally on port 4000
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9091:9090"   # Prometheus is exposed externally on port 9091
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    restart: always
    depends_on:
      - app

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "30001:3000"  # Grafana is exposed externally on port 30001
    restart: always
    depends_on:
      - prometheus