apiVersion: v1
kind: Service
metadata:
  name: node-app-service
spec:
  type: LoadBalancer # Exposes the service externally (use NodePort if running locally on Minikube)
  selector:
    app: node-app
  ports:
    - protocol: TCP
      port: 80         # External port users access
      targetPort: 3000 # Container port your Node.js app listens on